              Las ondas mecánicas transportan energía sin transporte de materia. La velocidad de propagación acústica es $v = f \\lambda$.

    const CONSTANTS_DATA = [
      { name: 'Velocidad de la luz en el vacío', symbol: 'c', value: '2.998 \\times 10^8', unit: 'm/s' },
      { name: 'Carga elemental', symbol: 'e', value: '1.602 \\times 10^{-19}', unit: 'C' },
      { name: 'Permitividad del vacío', symbol: '\\varepsilon_0', value: '8.854 \\times 10^{-12}', unit: 'F/m' },
      { name: 'Permeabilidad del vacío', symbol: '\\mu_0', value: '4\\pi \\times 10^{-7}', unit: 'H/m' },
      { name: 'Constante universal de los gases', symbol: 'R', value: '8.314', unit: 'J/(mol\\cdot K)' },
      { name: 'Constante de Boltzmann', symbol: 'k_B', value: '1.381 \\times 10^{-23}', unit: 'J/K' },
      { name: 'Velocidad del sonido en aire (20°C)', symbol: 'v_s', value: '343', unit: 'm/s' }
    ];

    // --- SIMULADOR 3D 1: TERMODINÁMICA Y TEORÍA CINÉTICA ---
    const ThermoSimulation = ({ temp, particlesCount }) => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
        camera.position.set(0, 8, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Contenedor Industrial Transparente (Reefer / Tanque)
        const boxGeo = new THREE.BoxGeometry(8, 8, 8);
        const boxMat = new THREE.MeshBasicMaterial({
          color: 0x06b6d4,
          wireframe: true,
          transparent: true,
          opacity: 0.3
        });
        const boxMesh = new THREE.Mesh(boxGeo, boxMat);
        scene.add(boxMesh);

        // Iluminación
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        // Partículas de Gas Ideal
        const count = particlesCount;
        const pGeometry = new THREE.SphereGeometry(0.2, 8, 8);
        const pMaterial = new THREE.MeshStandardMaterial({
          color: 0xf59e0b,
          roughness: 0.3
        });

        const instancedMesh = new THREE.InstancedMesh(pGeometry, pMaterial, count);
        const dummy = new THREE.Object3D();

        const pos = [];
        const vel = [];
        const bounds = 3.8;

        for (let i = 0; i < count; i++) {
          const px = (Math.random() - 0.5) * (bounds * 2);
          const py = (Math.random() - 0.5) * (bounds * 2);
          const pz = (Math.random() - 0.5) * (bounds * 2);
          pos.push(new THREE.Vector3(px, py, pz));

          const speedMultiplier = Math.sqrt(temp / 300) * 0.08;
          vel.push(new THREE.Vector3(
            (Math.random() - 0.5) * speedMultiplier,
            (Math.random() - 0.5) * speedMultiplier,
            (Math.random() - 0.5) * speedMultiplier
          ));
        }

        scene.add(instancedMesh);

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          const currentSpeedMult = Math.sqrt(temp / 300) * 0.08;

          for (let i = 0; i < count; i++) {
            let p = pos[i];
            let v = vel[i];

            // Normalizar velocidad según temperatura ajustada
            v.normalize().multiplyScalar(currentSpeedMult);

            p.add(v);

            // Rebotar en paredes
            if (Math.abs(p.x) > bounds) { v.x *= -1; p.x = Math.sign(p.x) * bounds; }
            if (Math.abs(p.y) > bounds) { v.y *= -1; p.y = Math.sign(p.y) * bounds; }
            if (Math.abs(p.z) > bounds) { v.z *= -1; p.z = Math.sign(p.z) * bounds; }

            dummy.position.copy(p);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
          }
          instancedMesh.instanceMatrix.needsUpdate = true;

          controls.update();
          renderer.render(scene, camera);
        };

        animate();

        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          controls.dispose();
          renderer.dispose();
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [temp, particlesCount]);

      return <div ref={mountRef} className="w-full h-full min-h-[350px] rounded-lg overflow-hidden relative" />;
    };

    // --- SIMULADOR 3D 2: ELECTROMAGNETISMO Y PORTAL RFID ---
    const EMSimulation = ({ charge, distance }) => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
        camera.position.set(0, 6, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Portal Antena RFID
        const frameGeo = new THREE.BoxGeometry(8, 6, 0.4);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8 });
        const frame = new THREE.Mesh(frameGeo, frameMat);
        scene.add(frame);

        // Núcleo Emisor
        const coreGeo = new THREE.CylinderGeometry(0.6, 0.6, 5, 16);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.rotation.z = Math.PI / 2;
        scene.add(core);

        // Pallet / Carga con Etiqueta RFID
        const palletGeo = new THREE.BoxGeometry(2, 2, 2);
        const palletMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
        const pallet = new THREE.Mesh(palletGeo, palletMat);
        pallet.position.set(0, -1, distance);
        scene.add(pallet);

        // Líneas de Campo Magnético / Electromagnético Representativas
        const ringGroup = new THREE.Group();
        const ringsCount = 6;
        for (let i = 1; i <= ringsCount; i++) {
          const r = i * 0.9 * (charge / 5);
          const ringGeo = new THREE.TorusGeometry(r, 0.03, 16, 100);
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0x06b6d4,
            transparent: true,
            opacity: Math.max(0.1, 1 - r / 7)
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ringGroup.add(ring);
        }
        scene.add(ringGroup);

        // Luz
        const pLight = new THREE.PointLight(0xffffff, 1.2);
        pLight.position.set(5, 8, 5);
        scene.add(pLight);
        scene.add(new THREE.AmbientLight(0x333333));

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          pallet.position.z = distance;
          ringGroup.rotation.z += 0.01;

          // Animación de pulso en las líneas de campo
          const scalePulse = 1 + Math.sin(Date.now() * 0.005) * 0.05;
          ringGroup.scale.set(scalePulse, scalePulse, scalePulse);

          controls.update();
          renderer.render(scene, camera);
        };

        animate();

        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          controls.dispose();
          renderer.dispose();
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [charge, distance]);

      return <div ref={mountRef} className="w-full h-full min-h-[350px] rounded-lg overflow-hidden relative" />;
    };

    // --- SIMULADOR 3D 3: ONDAS ULTRASÓNICAS Y NIVEL DE TANQUE ---
    const WavesSimulation = ({ freq, liquidLevel }) => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Silo / Tanque Cilindrico
        const tankGeo = new THREE.CylinderGeometry(3, 3, 8, 32, 1, true);
        const tankMat = new THREE.MeshStandardMaterial({
          color: 0x475569,
          wireframe: true,
          transparent: true,
          opacity: 0.4
        });
        const tank = new THREE.Mesh(tankGeo, tankMat);
        scene.add(tank);

        // Nivel de Líquido Almacenado
        const liquidGeo = new THREE.CylinderGeometry(2.9, 2.9, liquidLevel, 32);
        const liquidMat = new THREE.MeshStandardMaterial({
          color: 0x06b6d4,
          transparent: true,
          opacity: 0.75,
          roughness: 0.1
        });
        const liquid = new THREE.Mesh(liquidGeo, liquidMat);
        liquid.position.y = -4 + liquidLevel / 2;
        scene.add(liquid);

        // Sensor Ultrasónico en la parte superior
        const sensorGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.6, 16);
        const sensorMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
        const sensor = new THREE.Mesh(sensorGeo, sensorMat);
        sensor.position.set(0, 4.3, 0);
        scene.add(sensor);

        // Anillos representativos de la Onda Ultrasónica
        const waveRings = [];
        const ringCount = 5;
        for (let i = 0; i < ringCount; i++) {
          const wGeo = new THREE.RingGeometry(0.1, 0.25, 32);
          const wMat = new THREE.MeshBasicMaterial({
            color: 0x10b981,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8
          });
          const ring = new THREE.Mesh(wGeo, wMat);
          ring.rotation.x = Math.PI / 2;
          ring.position.y = 4.0;
          scene.add(ring);
          waveRings.push(ring);
        }

        // Luz
        const pLight = new THREE.PointLight(0xffffff, 1.2);
        pLight.position.set(6, 8, 6);
        scene.add(pLight);
        scene.add(new THREE.AmbientLight(0x333333, 2));

        let animationFrameId;
        let progress = 0;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          progress += 0.03 * (freq / 20);
          if (progress > 1) progress = 0;

          const topY = 4.0;
          const liquidSurfaceY = -4 + liquidLevel;

          waveRings.forEach((ring, idx) => {
            const offset = (progress + idx / ringCount) % 1;
            const currentY = topY - offset * (topY - liquidSurfaceY);
            ring.position.y = currentY;
            const scale = 0.2 + offset * 2.5;
            ring.scale.set(scale, scale, scale);
            ring.material.opacity = 1 - offset;
          });

          controls.update();
          renderer.render(scene, camera);
        };

        animate();

        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          controls.dispose();
          renderer.dispose();
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [freq, liquidLevel]);

      return <div ref={mountRef} className="w-full h-full min-h-[350px] rounded-lg overflow-hidden relative" />;
    };
