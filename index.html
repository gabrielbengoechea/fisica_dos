<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Física II · Ingeniería en Logística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--pn:#fff;--ink:#16212b;--mu:#5a6877;--ln:#d5dce3;--ac:#c2410c;--ac2:#fde6d8;--ok:#14804f;--bad:#c42b52;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161e;--pn:#18222d;--ink:#e6edf3;--mu:#93a3b3;--ln:#2a3846;--ac:#ff8a4c;--ac2:#3a2519;--ok:#3ecf8e;--bad:#ff6b8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161e;--pn:#18222d;--ink:#e6edf3;--mu:#93a3b3;--ln:#2a3846;--ac:#ff8a4c;--ac2:#3a2519;--ok:#3ecf8e;--bad:#ff6b8a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 16px;border-right:1px solid var(--ln);background:var(--pn)}
nav h1{font-size:22px}nav .sub{color:var(--mu);font-size:14px;margin:4px 0 14px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.un{margin:18px 0 6px;font-weight:600;font-size:14px;color:var(--mu)}
.cb{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.cb:hover{background:var(--bg)}.cb.on{background:var(--ac2);font-weight:600}.cb b{color:var(--mu);font-weight:600;white-space:nowrap}.cb.done b{color:var(--ok)}
nav details{margin-top:18px;font-size:14px;color:var(--mu)}nav summary{cursor:pointer;font-weight:600}nav details p{margin:6px 0}
.tools{display:flex;gap:8px;margin-top:16px}
.tools button{flex:1}
main{padding:28px clamp(16px,4vw,48px) 60px;max-width:900px}
.ref{color:var(--mu);font-size:15px}
h2{font-size:clamp(26px,4vw,36px);margin:4px 0 20px}
.st{margin:34px 0 0;padding-top:20px;border-top:1px solid var(--ln)}
.st h3{font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.st h3 span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--pn);font-size:15px}
.eq{font-size:clamp(20px,3.4vw,28px);padding:14px 18px;margin:12px 0 6px;background:var(--pn);border-left:4px solid var(--ac);border-radius:0 8px 8px 0;font-family:"Bricolage Grotesque",serif}
.leg{color:var(--mu);font-size:15px;margin:0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px}
.opt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:10px 14px;border:1px solid var(--ln);border-radius:8px;background:var(--pn);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--pn))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--pn))}
.why{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--bg);font-size:16px}.why b{color:var(--ok)}.why.x b{color:var(--bad)}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
canvas{width:100%;height:240px;display:block;background:var(--pn);border:1px solid var(--ln);border-radius:12px}
.cap{font-size:14px;color:var(--mu);margin:4px 2px 0}
.ctl{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 22px}
.ctl label{display:flex;justify-content:space-between;font-size:15px;font-weight:600}.ctl label em{font-style:normal;color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);height:32px}
.out{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:baseline;padding:14px 16px;background:var(--ac2);border-radius:12px}
.out strong{font:700 clamp(26px,5vw,38px)/1 "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;color:var(--ac)}
.out span{color:var(--mu);font-size:15px}.out .stp{flex-basis:100%;color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.warn{flex-basis:100%;color:var(--bad);font-weight:600}
.kpi{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--ac2);font-size:14px;font-weight:600}
button.b{padding:9px 16px;border:1px solid var(--ln);border-radius:8px;background:var(--pn);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
button.b:hover{border-color:var(--ac)}button.p{background:var(--ac);color:var(--pn);border-color:var(--ac);font-weight:600}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card+.card{margin-top:12px}.tm{font-variant-numeric:tabular-nums;color:var(--ac);margin-left:12px}
@media(max-width:820px){.app{display:block}nav{position:static;height:auto;border:0;border-bottom:1px solid var(--ln)}.sim{grid-template-columns:1fr}.un{display:none}nav .cl{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px}.cb{white-space:nowrap;border:1px solid var(--ln)}nav details,.tools{display:none}}
</style>
</head>
<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Utilidades ----------
const $=s=>document.querySelector(s);
const fmt=x=>{const a=Math.abs(x);if(a!==0&&(a>=1e5||a<0.01)){const[m,e]=x.toExponential(2).split('e');return m+'×10<sup>'+(+e)+'</sup>'}return (+x.toPrecision(3)).toLocaleString('es')};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Contenido ----------
// s: controles [clave, etiqueta, unidad, min, max, paso, valor inicial]. f: modelo. o: [salida, unidad]. st: sustitución paso a paso.
const U=[
{n:'Unidad 1 · Termodinámica',ch:[
{id:'cond',t:'Temperatura y calor',r:'Cap. 1',
 idea:'El calor siempre fluye de lo caliente a lo frío. Un buen aislante lo frena: cuanto más grueso (d) y menos conductor (k), menos calor entra al contenedor refrigerado.',
 eq:'P = k · A · ΔT / d',leg:'P: calor que entra (W) · k: conductividad del aislante (W/m·K) · A: área de pared (m², aquí 90) · ΔT: Texterior − Tinterior (K) · d: espesor (m)',
 s:[['d','Espesor del aislante d','m',.02,.2,.005,.08],['T','Temperatura exterior','°C',0,45,1,32],['k','Conductividad k','W/m·K',.02,.06,.002,.03]],
 f:v=>v.k*90*(v.T+18)/v.d,o:['Calor que entra','W'],an:'cond',
 st:v=>`P = ${v.k}·90·${v.T+18} / ${v.d}`,
 pred:{q:'Un reefer opera a −18 °C con 32 °C afuera. Si el espesor del aislante se duplica, ¿cómo cambia la tasa de transferencia de calor?',o:['Se duplica','Se reduce a la mitad','Permanece constante','Se cuadruplica'],a:1,w:'P es inversamente proporcional a d (P ∝ 1/d). Doble espesor → mitad de calor.'},
 quiz:{q:'¿Qué cambio reduce más la carga térmica sin tocar el tamaño del contenedor?',o:['Usar un aislante con k menor','Subir la temperatura exterior','Reducir el espesor','Aumentar el área A'],a:0,w:'Menor k significa que el material conduce peor el calor. P es proporcional a k, así que bajar k reduce P directamente.'},
 caso:{t:'Cadena de frío en contenedores reefer',x:'Cada vatio que entra por las paredes debe sacarlo el equipo frigorífico, que gasta diésel. Con el simulador puedes estimar cuánta carga térmica ahorras al cambiar el aislante, antes de comprar nada.',k:'Variación térmica permitida: ±0,5 °C'}},
{id:'gas',t:'Teoría cinética de los gases',r:'Cap. 2',
 idea:'La presión de un gas viene de millones de choques de moléculas contra las paredes. Si calientas el gas, las moléculas van más rápido y chocan con más fuerza; si reduces el volumen, chocan más seguido.',
 eq:'P · V = n · R · T',leg:'P: presión (Pa) · V: volumen (m³) · n: moles · R = 8,314 J/(mol·K) · T: temperatura absoluta (K). Velocidad molecular típica: v<sub>rms</sub> = √(3RT/M)',
 s:[['T','Temperatura T','K',200,600,5,300],['n','Cantidad de gas n','mol',50,500,10,200],['V','Volumen V','m³',1,10,.5,5]],
 f:v=>v.n*8.314*v.T/v.V/1e5,o:['Presión','bar'],an:'gas',lim:[4.5,'⚠ Supera la presión máxima operativa del tanque (4,5 bar)'],
 st:v=>`P = ${v.n}·8,314·${v.T} / ${v.V} = ${fmt(v.n*8.314*v.T/v.V)} Pa`,
 pred:{q:'La temperatura absoluta de un gas ideal en un tanque rígido y hermético se triplica. ¿Qué pasa con la presión?',o:['Disminuye a un tercio','Se duplica','Se triplica','Aumenta 9 veces'],a:2,w:'Con V y n constantes, P es directamente proporcional a T (Gay-Lussac). Triple T → triple P.'},
 quiz:{q:'En el mismo tanque y a la misma temperatura, duplicas la cantidad de gas n. La presión…',o:['Se reduce a la mitad','Se duplica','Se cuadruplica','No cambia'],a:1,w:'P = nRT/V: con T y V fijos, P es proporcional a n. Más moléculas, más choques.'},
 caso:{t:'Transporte marítimo de gas natural licuado (GNL)',x:'El gas que se evapora (boil-off) sube la presión del tanque criogénico durante la travesía. Vigilar T permite anticipar la presión y usar el exceso como combustible del buque. Prueba subir T y observa cuándo salta la alerta.',k:'Presión máxima operativa: 4,5 bar'}},
{id:'carnot',t:'1ª y 2ª ley de la termodinámica',r:'Cap. 3 y 4',
 idea:'La 1ª ley dice que la energía se conserva. La 2ª dice que ningún motor convierte todo el calor en trabajo: siempre debe tirar calor a un foco frío. El límite máximo es la eficiencia de Carnot.',
 eq:'η<sub>máx</sub> = 1 − T<sub>C</sub> / T<sub>H</sub>',leg:'T<sub>H</sub>: temperatura de combustión (K) · T<sub>C</sub>: temperatura del escape (K) · Trabajo máximo W = η·Q<sub>H</sub>. Un diésel real logra ≈ 42 %.',
 s:[['H','Temperatura caliente T_H','K',500,1200,10,900],['C','Temperatura fría T_C','K',250,400,5,300],['Q','Calor aportado Q_H','MJ',50,200,10,100]],
 f:v=>(1-v.C/v.H)*100,o:['Eficiencia máxima','%'],an:'gauge',
 st:v=>`η = 1 − ${v.C}/${v.H} = ${fmt(1-v.C/v.H)}  →  W máx = ${fmt((1-v.C/v.H)*v.Q)} MJ de ${v.Q} MJ`,
 pred:{q:'Si bajas la temperatura del foco frío T_C (manteniendo T_H), la eficiencia máxima de Carnot…',o:['Aumenta','Disminuye','No cambia','Se vuelve 100 %'],a:0,w:'η = 1 − T_C/T_H: con T_C menor, la fracción que se desperdicia es menor y η sube. Solo llegaría a 100 % si T_C = 0 K, imposible.'},
 quiz:{q:'¿Por qué ningún motor comercial alcanza 100 % de eficiencia térmica?',o:['Por fallas de lubricación','Porque violaría la 2ª ley: siempre debe rechazar calor a un foco frío','Por la mala calidad del diésel','Porque la energía no se conserva en ciclos'],a:1,w:'Kelvin-Planck: es imposible un motor cíclico que absorba calor y lo convierta íntegramente en trabajo sin ceder calor a un foco más frío.'},
 caso:{t:'Eficiencia energética en flotas diésel',x:'Cada punto de eficiencia es combustible que no se compra. Menos fricción y mejor mantenimiento acercan al camión a su límite teórico. Compara el límite de Carnot con el 42 % real y mira cuánto margen queda.',k:'Eficiencia térmica objetivo: > 42 %'}}]},
{n:'Unidad 2 · Electricidad y magnetismo',ch:[
{id:'coulomb',t:'Cargas, campos y potencial',r:'Cap. 5-7',
 idea:'Cargas del mismo signo se repelen y de signo contrario se atraen. La fuerza cae muy rápido con la distancia: es una ley del inverso del cuadrado.',
 eq:'F = k · q₁ · q₂ / r²',leg:'F: fuerza (N) · k = 8,99×10⁹ N·m²/C² · q₁, q₂: cargas (μC) · r: distancia entre cargas (m)',
 s:[['r','Distancia r','m',.1,2,.05,.5],['a','Carga q₁','μC',1,20,1,5],['b','Carga q₂','μC',1,20,1,5]],
 f:v=>8.99e9*v.a*1e-6*v.b*1e-6/(v.r*v.r),o:['Fuerza','N'],an:'coul',
 st:v=>`F = 8,99×10⁹·(${v.a}×10⁻⁶)·(${v.b}×10⁻⁶) / ${v.r}²`,
 pred:{q:'Si la distancia entre dos cargas puntuales se reduce a la mitad, la fuerza…',o:['Se reduce a la mitad','Se duplica','Aumenta por un factor de 4','Permanece constante'],a:2,w:'F ∝ 1/r². Con r/2: 1/(1/2)² = 4. Distancia a la mitad → fuerza ×4.'},
 quiz:{q:'Duplicas q₁ y también duplicas r. La fuerza final es…',o:['El doble','La mitad','La misma','Cuatro veces mayor'],a:1,w:'q₁ ×2 duplica F, pero r ×2 la divide entre 2² = 4. Resultado: 2/4 = 1/2.'},
 caso:{t:'Protección contra descargas (ESD) en almacenes de electrónica',x:'Una carga estática acumulada puede dañar microcomponentes al descargarse. Pisos conductivos y pulseras a tierra drenan la carga antes de llegar al punto de ruptura del aire (3×10⁶ V/m).',k:'Potencial electrostático seguro: < 100 V'}},
{id:'circ',t:'Capacitancia, corriente y circuitos CC',r:'Cap. 8-10',
 idea:'La ley de Ohm relaciona voltaje, corriente y resistencia. Al poner resistores en paralelo le das a la corriente más caminos, así que la resistencia total baja y circula más corriente.',
 eq:'I = V / R<sub>eq</sub> ,  1/R<sub>eq</sub> = 1/R₁ + 1/R₂',leg:'V: voltaje de la fuente (V) · R: resistencias (Ω) · I: corriente total (A) · Potencia P = V·I',
 s:[['a','Resistor R₁','Ω',2,50,1,10],['b','Resistor R₂','Ω',2,50,1,10],['V','Voltaje de la fuente','V',5,100,1,20]],
 f:v=>v.V*(v.a+v.b)/(v.a*v.b),o:['Corriente total','A'],an:'gauge',
 st:v=>{const r=v.a*v.b/(v.a+v.b);return `R<sub>eq</sub> = ${v.a}·${v.b}/(${v.a}+${v.b}) = ${fmt(r)} Ω ;  I = ${v.V}/${fmt(r)} ;  P = ${fmt(v.V*v.V/r)} W`},
 pred:{q:'Al conectar un segundo resistor en paralelo al primero, la corriente total que entrega la fuente…',o:['Disminuye','Aumenta','No cambia','Se vuelve cero'],a:1,w:'En paralelo la resistencia equivalente es menor que cada resistor. Con el mismo V, I = V/R_eq aumenta.'},
 quiz:{q:'Dos resistores de 10 Ω en paralelo se conectan a 20 V. ¿Cuál es la corriente total?',o:['1 A','2 A','4 A','0,5 A'],a:2,w:'R_eq = 10/2 = 5 Ω, entonces I = 20 V / 5 Ω = 4 A.'},
 caso:{t:'Baterías y recarga de flotas AGV',x:'Los vehículos de guiado automático deben recargar rápido para operar 24/7. A mayor voltaje del bus, menor corriente para la misma potencia, y las pérdidas por calor (I²R) en los cables bajan mucho.',k:'Eficiencia de recarga: > 92 %'}},
{id:'faraday',t:'Magnetismo e inducción',r:'Cap. 11-14',
 idea:'Un campo magnético que cambia en el tiempo induce un voltaje. Así una antena RFID energiza la etiqueta de un pallet sin tocarla: lo que importa es qué tan rápido cambia el flujo.',
 eq:'ε = N · ΔB · A / Δt',leg:'ε: fem inducida (V) · N: vueltas de la bobina · ΔB: cambio de campo (T) · A: área de la bobina (m², aquí 0,05) · Δt: tiempo del cambio (s). El signo negativo (Lenz) indica que se opone al cambio.',
 s:[['t','Tiempo del cambio Δt','s',.01,1,.01,.1],['N','Vueltas N','',1,200,1,50],['B','Cambio de campo ΔB','T',.01,.5,.01,.1]],
 f:v=>v.N*v.B*.05/v.t,o:['Voltaje inducido','V'],an:'gauge',
 st:v=>`ε = ${v.N}·${v.B}·0,05 / ${v.t}`,
 pred:{q:'Si el pallet cruza el portal al doble de velocidad (Δt a la mitad), el voltaje inducido…',o:['Se reduce a la mitad','Se duplica','No cambia','Se cuadruplica'],a:1,w:'ε ∝ 1/Δt. Cambiar el flujo en la mitad del tiempo duplica la fem.'},
 quiz:{q:'Según la ley de Lenz, la corriente inducida en un circuito cerrado…',o:['Aumenta siempre el campo externo','Se opone al cambio en el flujo magnético que la produce','Genera calor inmediato','Anula el potencial de la fuente'],a:1,w:'El sentido de la corriente inducida es tal que se opone a la variación de flujo que la origina (el signo menos de Faraday).'},
 caso:{t:'Portales RFID para trazabilidad de pallets',x:'La antena del portal genera un campo variable que induce voltaje en el chip de cada etiqueta pasiva. Más vueltas o un campo que cambia más rápido dan más voltaje y más lecturas por segundo.',k:'Tasa de lectura efectiva: 99,98 %'}}]},
{n:'Unidad 3 · Ondas y acústica',ch:[
{id:'eco',t:'Ondas, sonido y ultrasonido',r:'Cap. 15-17',
 idea:'Un sensor ultrasónico mide distancias como un murciélago: emite un pulso, espera el eco y calcula. Como el sonido hace ida y vuelta, la distancia es la mitad del recorrido total.',
 eq:'d = v · t / 2',leg:'d: distancia al material (m) · v ≈ 331 + 0,6·T (m/s, T en °C) · t: tiempo hasta recibir el eco (s)',
 s:[['t','Tiempo del eco','ms',1,30,.5,10],['T','Temperatura del aire','°C',-10,40,1,20]],
 f:v=>(331+.6*v.T)*v.t/1000/2,o:['Distancia a la carga','m'],an:'echo',
 st:v=>`v = 331 + 0,6·${v.T} = ${fmt(331+.6*v.T)} m/s ;  d = ${fmt(331+.6*v.T)}·${v.t/1000}/2`,
 pred:{q:'En un silo, el eco tarda el doble de tiempo en volver que la última medición (misma temperatura). La superficie del grano está…',o:['Al doble de distancia','A la mitad','A la misma distancia','Cuatro veces más lejos'],a:0,w:'d = vt/2 es proporcional a t. Doble tiempo de eco → doble distancia (el grano bajó).'},
 quiz:{q:'Un sensor recibe el eco 0,01 s después de emitir. Con v = 340 m/s, ¿a qué distancia está la superficie?',o:['3,4 m','1,7 m','6,8 m','0,85 m'],a:1,w:'El recorrido total es 340 × 0,01 = 3,4 m (ida y vuelta). La distancia es la mitad: 1,7 m.'},
 caso:{t:'Sensores de nivel en silos y tanques',x:'Medir sin contacto evita contaminar el grano o el líquido. El sensor compensa la temperatura del aire, porque el sonido viaja más rápido cuando hace calor y, sin corregir, el nivel se leería mal.',k:'Precisión de nivel: ±2 mm'}}]}];
const CH=U.flatMap(u=>u.ch);
const MORE={
cond:[{q:'Una pared de 90 m² con k = 0,03 W/m·K, d = 0,1 m y ΔT = 50 K. ¿Cuánto calor entra?',o:['1 350 W','13,5 W','135 W','2 700 W'],a:0,w:'P = k·A·ΔT/d = 0,03·90·50/0,1 = 1 350 W.'},
 {q:'El contenedor llega a un puerto donde afuera hay 40 °C en lugar de 30 °C (interior −18 °C). ΔT pasa de 48 K a 58 K. El calor que entra aumenta aproximadamente…',o:['10 %','21 %','Se duplica','No cambia'],a:1,w:'P es proporcional a ΔT: 58/48 ≈ 1,21, o sea +21 %.'}],
gas:[{q:'Un tanque rígido de 5 m³ contiene 200 mol de gas a 300 K. ¿Cuál es la presión aproximada?',o:['0,1 bar','1 bar','10 bar','100 bar'],a:1,w:'P = nRT/V = 200·8,314·300/5 ≈ 99 800 Pa ≈ 1 bar.'},
 {q:'Si la temperatura absoluta se cuadruplica, la velocidad rms de las moléculas…',o:['Se cuadruplica','Se duplica','Aumenta √2 veces','No cambia'],a:1,w:'v_rms = √(3RT/M) es proporcional a √T. Con 4T: √4 = 2.'}],
carnot:[{q:'Un motor trabaja entre T_H = 800 K y T_C = 300 K. ¿Cuál es su eficiencia máxima (Carnot)?',o:['37,5 %','62,5 %','50 %','80 %'],a:1,w:'η = 1 − 300/800 = 0,625 = 62,5 %.'},
 {q:'Un camión con η = 40 % recibe Q_H = 100 MJ de combustible. ¿Cuánto calor se desecha al ambiente?',o:['40 MJ','60 MJ','100 MJ','140 MJ'],a:1,w:'W = 0,4·100 = 40 MJ. Por la 1ª ley, Q_C = Q_H − W = 60 MJ.'}],
coulomb:[{q:'Dos cargas de 2 μC están separadas 0,3 m. ¿Fuerza aproximada entre ellas?',o:['0,4 N','4 N','0,04 N','40 N'],a:0,w:'F = 8,99×10⁹·(2×10⁻⁶)²/0,3² ≈ 0,4 N.'},
 {q:'Dos cargas del mismo signo se acercan entre sí. La fuerza entre ellas es…',o:['Atractiva y aumenta','Repulsiva y aumenta','Repulsiva y disminuye','Atractiva y disminuye'],a:1,w:'Cargas iguales se repelen, y al disminuir r la fuerza crece como 1/r².'}],

const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

  E={qs:shuf(pool).slice(0,10).map(q=>({...q,ord:shuf(q.o.map((_,i)=>i))})),i:0,ans:[],left:900};
  clearInterval(tm);tm=setInterval(()=>{if(!E)return;E.left--;const t=$('#tmr');if(t)t.textContent=mmss(E.left);if(E.left<=0)examEnd()},1000);examView();
}

}

    b.classList.add(ok?'ok':'bad');wy.hidden=false;wy.className='why'+(ok?'':' x');
    wy.innerHTML=ok?'<b>Correcto.</b> '+q.w+(b.dataset.k=='p'?' Ahora compruébalo en el simulador de abajo.':''):'<b>Casi.</b> Vuelve a pensarlo con la fórmula e inténtalo otra vez. Pista: '+q.w.split('.')[0]+'.';
    if(ok){const k=b.dataset.k;if(k=='p')mark('p');else{done[c.id+k]=1;save();if(Q(c).every((_,j)=>done[c.id+'q'+j]))mark('q')}box.querySelectorAll('.opt').forEach(o=>o.disabled=true)}
  }
  if(b.id=='th'){const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark';r.dataset.theme=d?'light':'dark';update(false)}
  if(b.id=='rs'&&confirm('¿Borrar todo tu avance?')){done={};cur=0;save();view()}
});
document.addEventListener('input',e=>{const r=e.target;if(r.type=='range'){vals[r.dataset.k]=+r.value;update(true)}});
addEventListener('resize',()=>{if($('#pl'))update(false)});
view();
</script>
</body>
</html>
